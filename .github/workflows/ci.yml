name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore backend/BikeRepairShop.sln
      - run: dotnet build backend/BikeRepairShop.sln --no-restore
      - run: dotnet format backend/BikeRepairShop.sln --verify-no-changes --no-restore
      # Integration tests start postgres:18 through Testcontainers on the runner's Docker daemon.
      - run: dotnet test backend/BikeRepairShop.sln --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify
